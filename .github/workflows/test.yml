name: "Test"
on:
  pull_request:
    branches: [main]
jobs:
  check-code:
    name: Tests
    runs-on: [self-hosted, blink, small]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
      # The self-hosted runners ship no system yarn, unlike the GH-hosted
      # images.
      - run: npm install -g yarn
      # Prebuilt deps, same idea as the bundled-deps tarball in Concourse
      # (that one lives in a private GCS bucket; fork PRs have no secrets,
      # so the GitHub-side equivalent is the Actions cache).
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --frozen-lockfile
      # Sizes the jest worker count against what this runner really has.
      - run: nproc && free -m
      # Flake handling happens at test granularity now: jest retries individual
      # failing tests in CI (see jest.setup-after-env.ts) and annotates each
      # retried error (see jest.config.js), instead of silently re-running the
      # whole job.
      # Two workers instead of `yarn test`'s --runInBand, which took 19m46-19m59s
      # here against a 20-minute limit. A worker past 1 GB is replaced between
      # files, so heap growth that used to OOM long in-band runs stays bounded.
      - run: yarn test:ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # Kept loose until the parallel run's time on this runner is known;
        # then tighten to 2-3x it, so a real hang fails fast.
        timeout-minutes: 30
  android-unit-test:
    name: Android unit tests
    # GH-hosted: ships the Android SDK and JDK toolchains the Gradle build
    # auto-detects, unlike the self-hosted small runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
      # Gradle needs node_modules for the RN gradle plugins and autolinking.
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --frozen-lockfile
      # Caches ~/.gradle/caches and the wrapper between runs.
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android
        timeout-minutes: 30
