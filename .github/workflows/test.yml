name: "Test"
on:
  pull_request:
    branches: [main]
jobs:
  # Two shards on two small runners, each a single in-band process over half the
  # suites. One process over all 729 suites crept to ~3.9 GB against its 4 GB heap
  # cap and took 19 of the job's 20 minutes: ts-jest carries a full type program
  # (ts-auto-mock needs the checker), and it grows with every file the process has
  # seen, so both memory and time are superlinear in a single process and roughly
  # linear when split. A shard's live set is ~2.3 GB; under a 3 GB cap it peaks at
  # ~2.6 GB and runs in ~3 minutes on one core (a 4 GB cap only let the heap idle
  # higher, and was slower). Not `--maxWorkers=2` on one runner: two type programs
  # did not fit the box, and the forced GC that made worker recycling measurable
  # costs over a second per file on a slow core — that configuration timed out on
  # the runner. No `--expose-gc` here for the same reason.
  test-shard:
    name: Tests (shard ${{ matrix.shard }} of 2)
    runs-on: [self-hosted, blink, small]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
      # The self-hosted runners ship no system yarn, unlike the GH-hosted
      # images.
      - run: npm install -g yarn
      # Prebuilt deps, same idea as the bundled-deps tarball in Concourse
      # (that one lives in a private GCS bucket; fork PRs have no secrets,
      # so the GitHub-side equivalent is the Actions cache).
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --frozen-lockfile
      # Flake handling happens at test granularity now: jest retries individual
      # failing tests in CI (see jest.setup-after-env.ts) and logs each retried
      # error, instead of silently re-running the whole job.
      - run: yarn test --runInBand --shard=${{ matrix.shard }}/2
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        timeout-minutes: 20
  # The required check keeps its name. It fails unless every shard succeeded — a
  # skipped or cancelled shard is not a pass.
  check-code:
    name: Tests
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.test-shard.result }}" != "success" ]; then
            echo "test shards: ${{ needs.test-shard.result }}" >&2
            exit 1
          fi
  android-unit-test:
    name: Android unit tests
    # GH-hosted: ships the Android SDK and JDK toolchains the Gradle build
    # auto-detects, unlike the self-hosted small runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
      # Gradle needs node_modules for the RN gradle plugins and autolinking.
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --frozen-lockfile
      # Caches ~/.gradle/caches and the wrapper between runs.
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android
        timeout-minutes: 30
