name: Update Cocoapods Dependencies
on:
  push:
    branches:
      - dependabot/npm_and_yarn/**
  pull_request:
    branches:
      - dependabot/npm_and_yarn/**

# Reading @blinkbitcoin/esign-* from GitHub Packages needs this on the job token;
# the default token has no package access.
permissions:
  contents: read
  packages: read

jobs:
  run:
    name: Run pod install
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GT }}
          ref: ${{ github.head_ref }}

      # No setup-node here, so the scoped auth the other workflows get from it has
      # to be written by hand. The runner is ephemeral, so the home npmrc is fine.
      - name: Install Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          yarn install --non-interactive --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache node_modules and Pods
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Cocoapods Packages
        run: pushd ios && pod install --repo-update --verbose && popd

      - uses: stefanzweifel/git-auto-commit-action@v4.1.1
        with:
          commit_message: Bump Cocoapods Packages
          branch: ${{ github.head_ref }}
          token: ${{ secrets.GT }}
