#! Originally synced from github.com/GaloyMoney/concourse-shared (now archived).
#! blink-mobile is not a sync target, so this file is maintained directly here.

name: Audit

on:
  pull_request:
    branches: [main]

# Reading @blinkbitcoin/esign-* from GitHub Packages needs this on the job token;
# the default token has no package access.
permissions:
  contents: read
  packages: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: "yarn"
          # The @blinkbitcoin scope resolves from GitHub Packages (see .npmrc),
          # which needs auth even to read. Written to a runner-local npmrc so the
          # token never has to live in the repo's own .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: "@blinkbitcoin"
      - run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run audit
        run: make audit
